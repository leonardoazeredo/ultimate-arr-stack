# Local .lan domain routing (port-free access)
#
# How it works:
# 1. Pi-hole DNS resolves *.lan → TRAEFIK_LAN_IP (macvlan, e.g. 192.168.1.11)
# 2. Browser requests http://sonarr.lan → Traefik on port 80 (macvlan IP)
# 3. Traefik matches Host header → routes to correct service:port
#
# Result: http://sonarr.lan instead of http://192.168.1.10:8989
#
# Note: Requires Traefik macvlan setup (see docs/LOCAL-DNS.md)
#
# Every router below has a `-secure` twin on the `websecure` entrypoint
# requiring basicauth (`admin-auth@docker`, see docker-compose.traefik.yml)
# and serving the mkcert-issued internal cert (see docs/HTTPS-LOCAL.md). The
# `web` (:80) router just 301s to https via the `https-redirect` middleware
# instead of serving the app directly. This now includes Seerr on .lan even
# though it has its own app-level login - the extra basicauth layer is
# intentional there (see docs/HTTPS-LOCAL.md for the caveat about
# non-browser clients: Kodi, mobile apps, Chromecast/smart TVs may not
# handle an HTTP Basic Auth challenge). Jellyfin (below) deliberately has NO
# admin-auth on its -secure router: its web client fires many concurrent
# requests (websocket, HLS video segments, thumbnails) and not all of them
# reliably carry the browser's cached Basic Auth header, so the same gate
# that works fine for a simple admin UI produced repeated/looping native
# auth prompts here instead. Jellyfin's own app-level login is the real gate
# for it; security-headers + TLS still apply. Their separate
# Cloudflare-facing public routers are untouched - Cloudflare already
# terminates TLS and those keep using app-level auth only, not admin-auth.

http:
  routers:
    # === Media Services ===
    jellyfin-lan:
      rule: "Host(`jellyfin.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: jellyfin-lan
    jellyfin-lan-secure:
      rule: "Host(`jellyfin.lan`)"
      entryPoints: [websecure]
      tls: {}
      # No admin-auth here (deliberately) - see the file header comment.
      middlewares: [security-headers]
      service: jellyfin-lan

    seerr-lan:
      rule: "Host(`seerr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: seerr-lan
    seerr-lan-secure:
      rule: "Host(`seerr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: seerr-lan

    # The Stremio addon. No admin-auth on the -secure router, and for a
    # stronger reason than Jellyfin's: Stremio is the client, not a browser.
    # It fetches this manifest, then every poster and stream URL the addon
    # hands back, and it has no way to answer an HTTP Basic challenge -- so a
    # 401 here is not a prompt, it is an addon that will not install, with no
    # way to enter the credential. The access control that matters is on the
    # other side of the addon: its stream URLs carry a Jellyfin API token, and
    # Jellyfin checks that token on every byte served.
    #
    # Why it exists at all: the addon's own port (60421) is not in the
    # `vlan20-to-nas-svcs` allow-list, so a client on VLAN20 -- the Mac, a
    # phone on the house wifi -- cannot reach NAS_IP:60421 directly. Traefik
    # IS allowed from VLAN20 on 443, so routing it here is what makes the
    # addon reachable at all. Verified: nc to 192.168.110.246:60421 from the
    # Mac times out, while 8096 and 443 answer.
    #
    # Streams do not come through here: the addon embeds
    # JELLYFIN_SERVER=${NAS_IP}:8096 into them, so only catalog and poster
    # traffic crosses this router.
    stremio-lan:
      rule: "Host(`stremio.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: stremio-lan
    stremio-lan-secure:
      rule: "Host(`stremio.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [security-headers]
      service: stremio-lan

    # The Magnetio addon, routed for the same reason as the Jellyfin one above:
    # it publishes port 7000, that port is not in the `vlan20-to-nas-svcs`
    # allow-list, and Traefik on 443 is. Without this router the addon is
    # reachable only from the NAS itself.
    #
    # It is not merely unreachable, though. The URL Stremio was holding is
    # `http://192.168.8.246:7000/...`, and 192.168.8.246 is the NAS's address
    # from before the segmentation rename -- it is 192.168.110.246 now and
    # nothing answers on 192.168.8.0/24 at all, so the addon was being asked
    # for at an address that no longer exists. Measured 2026-09-17: the board
    # rendered "TorBox - Movies - Movie / Env: Failed to fetch", and
    # `docker logs magnetio-addon` had never recorded a single stream request
    # from a client -- it was running correctly and hearing nothing.
    #
    # The plain HTTP in that URL is a separate matter and worth stating
    # precisely, because the obvious reading of it is wrong. Chrome does not
    # block an HTTP request to a private IP literal from an HTTPS page: Local
    # Network Access exempts private IP literals and `.local` names from the
    # mixed content check (developer.chrome.com/blog/local-network-access), and
    # measured here, `fetch('http://192.168.110.246:8096/System/Info/Public')`
    # from web.stremio.com returns 200 with the permission granted. What is
    # NOT exempt is an HTTP request to a `.lan` name, which is neither a
    # literal nor `.local` -- so the route below has to be HTTPS, and that is
    # the reason it is.
    #
    # No admin-auth on the -secure router, same as stremio.lan and for the same
    # reason: Stremio is a client that cannot answer an HTTP Basic challenge, so
    # a 401 here is an addon that will not install rather than a prompt. Note
    # what that leaves open, because it differs from every other router in this
    # file: the addon's own install URL carries the TorBox API key in its path,
    # and anything on a VLAN that may reach Traefik:443 can fetch that path and
    # read the key out of it. Access control is the network boundary plus the
    # unguessable path, not authentication. Treat rotating that key as also
    # meaning "reinstall this addon".
    magnetio-lan:
      rule: "Host(`magnetio.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: magnetio-lan
    magnetio-lan-secure:
      rule: "Host(`magnetio.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [security-headers]
      service: magnetio-lan

    # Legacy redirects (jellyseerr/jellyseer → seerr). Both entrypoints exist
    # so a direct https://jellyseerr.lan request (sniStrict requires a
    # matching cert SAN, see docs/HTTPS-LOCAL.md) still gets a clean redirect
    # to https://seerr.lan instead of a TLS handshake failure or a 404 with
    # no matching router.
    jellyseerr-lan:
      rule: "Host(`jellyseerr.lan`)"
      entryPoints: [web]
      middlewares: [jellyseerr-redirect]
      service: seerr-lan
    jellyseerr-lan-secure:
      rule: "Host(`jellyseerr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [jellyseerr-redirect]
      service: seerr-lan

    jellyseer-lan:
      rule: "Host(`jellyseer.lan`)"
      entryPoints: [web]
      middlewares: [jellyseerr-redirect]
      service: seerr-lan
    jellyseer-lan-secure:
      rule: "Host(`jellyseer.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [jellyseerr-redirect]
      service: seerr-lan

    # === *arr Stack (VPN-protected via Gluetun) ===
    sonarr-lan:
      rule: "Host(`sonarr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: sonarr-lan
    sonarr-lan-secure:
      rule: "Host(`sonarr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: sonarr-lan

    radarr-lan:
      rule: "Host(`radarr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: radarr-lan
    radarr-lan-secure:
      rule: "Host(`radarr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: radarr-lan

    prowlarr-lan:
      rule: "Host(`prowlarr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: prowlarr-lan
    prowlarr-lan-secure:
      rule: "Host(`prowlarr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: prowlarr-lan

    bazarr-lan:
      rule: "Host(`bazarr.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: bazarr-lan
    bazarr-lan-secure:
      rule: "Host(`bazarr.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: bazarr-lan

    # === Download Clients ===
    sabnzbd-lan:
      rule: "Host(`sabnzbd.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: sabnzbd-lan
    sabnzbd-lan-secure:
      rule: "Host(`sabnzbd.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: sabnzbd-lan

    # === Infrastructure ===
    traefik-lan:
      rule: "Host(`traefik.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: api@internal
    traefik-lan-secure:
      rule: "Host(`traefik.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: api@internal

    # pihole-lan and pihole-lan-secure are retired (Phase 8.4 of the DNS
    # migration). Pi-hole was stopped on 2026-09-21 and Phase 9 removes it, so
    # the upstream behind this route no longer exists — `pihole.lan` answered
    # with a basic-auth prompt and then failed, which is worse than not
    # answering at all because it looks like a credential problem.
    #
    # The name itself is retired with the service in 9.4, from the single file
    # both DNS stores are generated from
    # (`pihole/dnsmasq.d/02-local-dns.conf.example`).
    #
    # Not repointed at AdGuard Home, which is the obvious alternative and does
    # not work: AdGuard runs on the router and its admin port is refused from
    # every client VLAN, because `zone_vlan10_input` allows DHCP and DNS only.
    # Traefik runs on the NAS, on VLAN10, so it cannot reach it either. Proxying
    # it would mean opening router:3000 to VLAN10 — a segmentation decision, not
    # a route change. Until someone makes it deliberately, AdGuard's UI is at
    # `http://192.168.8.1:3000` from the maintenance VLAN, which is where the
    # router's own admin UI has always been.

    # === Utilities ===
    uptime-lan:
      rule: "Host(`uptime.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: uptime-lan
    uptime-lan-secure:
      rule: "Host(`uptime.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: uptime-lan

    duc-lan:
      rule: "Host(`duc.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: duc-lan
    duc-lan-secure:
      rule: "Host(`duc.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: duc-lan

    beszel-lan:
      rule: "Host(`beszel.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: beszel-lan
    beszel-lan-secure:
      rule: "Host(`beszel.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: beszel-lan

    homepage-lan:
      rule: "Host(`homepage.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: homepage-lan
    homepage-lan-secure:
      rule: "Host(`homepage.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: homepage-lan

    # The usenet blackhole's live download view, served read-only by
    # docker-compose.utilities.yml's usenet-status. It has no login of its own
    # and no published host port, so admin-auth here is its only access
    # control - same arrangement as duc and Beszel above.
    usenet-lan:
      rule: "Host(`usenet.lan`)"
      entryPoints: [web]
      middlewares: [https-redirect]
      service: usenet-lan
    usenet-lan-secure:
      rule: "Host(`usenet.lan`)"
      entryPoints: [websecure]
      tls: {}
      middlewares: [admin-auth@docker, security-headers]
      service: usenet-lan

  middlewares:
    jellyseerr-redirect:
      redirectRegex:
        regex: "^https?://jellyseer{1,2}[.]lan(.*)"
        replacement: "https://seerr.lan${1}"
        permanent: true

  services:
    # === Media Services ===
    jellyfin-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.4:8096"

    seerr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.8:5055"

    stremio-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.17:60421"

    # magnetio-addon declares no network of its own -- it runs on Gluetun's
    # network namespace (network_mode: "container:gluetun") so that all of its
    # traffic, DHT and peer connections included, leaves through the VPN tunnel.
    # So it is reached at Gluetun's arr-core address, not its own: there is no
    # separate IP for it to be reached at. Verified 2026-09-17 by fetching
    # http://172.20.0.3:7000/manifest.json from inside the Traefik container,
    # which returned the addon's manifest.
    magnetio-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:7000"

    # === *arr Stack ===
    # Sonarr/Radarr now run on the arr-core bridge with their own IPs
    # (no longer behind Gluetun). Prowlarr stays behind Gluetun (172.20.0.3).
    sonarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.10:8989"

    radarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.11:7878"

    prowlarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:9696"

    bazarr-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.9:6767"

    # === Download Clients (via Gluetun) ===
    sabnzbd-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.3:8080"

    # === Infrastructure ===
    # The pihole-lan service is gone with its routers (see above). Phase 8.4
    # asked for this upstream to be repointed at AdGuard Home on the router so
    # the route would survive Phase 9 — measured 2026-09-21, that cannot work:
    #
    #   * zone_vlan10_input allows a client VLAN to reach the router on DHCP
    #     (67-68) and DNS (53) only, then falls through to
    #     zone_vlan10_src_REJECT. AdGuard's admin port is refused from VLAN10;
    #   * the maintenance VLAN CAN reach it — 192.168.8.1:3000 answers 302 from
    #     pi1's eth0 — which is the path the migration plan's rollback ladder
    #     already assumes;
    #   * neither the tailnet nor the NAS's macvlan shim offers a way round: the
    #     shim and Traefik's macvlan are both on VLAN10 (192.168.110.251 and
    #     .250), and the NAS cannot reach the router's Tailscale address at all.
    #
    # Opening router:3000 to VLAN10 would breach the segmentation
    # tests/network-segmentation.bats exists to assert, for one admin UI already
    # reachable on the maintenance VLAN. So the route is retired rather than
    # repointed, and the name goes with the service in 9.4.

    # === Utilities ===
    uptime-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.13:3001"

    duc-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.14:80"

    beszel-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.15:8090"

    homepage-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.22:3000"

    usenet-lan:
      loadBalancer:
        servers:
          - url: "http://172.20.0.23:80"
